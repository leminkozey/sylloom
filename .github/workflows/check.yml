name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: dependencies
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run site:build
      - run: npm run release:check
      - if: runner.os == 'macOS'
        run: bash -n install.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          .\sylloom.cmd --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows entrypoint failed.' }
      - if: always() && runner.os == 'Windows' && steps.dependencies.conclusion == 'success'
        name: Install and verify official CPU runtimes
        id: runtimes
        shell: powershell
        env:
          SYLLOOM_HOME: ${{ runner.temp }}\sylloom-install-check
          SYLLOOM_GITHUB_TOKEN: ${{ github.token }}
        run: .\install.ps1 -SkipModels -NoLink
      - if: always() && runner.os == 'Windows' && steps.runtimes.conclusion == 'success'
        name: Native Windows smoke tests
        env:
          SYLLOOM_TEST_WINDOWS: '1'
        run: npx tsx --test test/windows-native.test.ts
